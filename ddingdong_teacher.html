<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>띵동링크 (교사용)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F8FB;
    --card: #FFFFFF;
    --ink: #2B3A55;
    --accent: #4A7DFF;
    --accent-dark: #3563D9;
    --mint: #7FD8C4;
    --muted: #8CA3C3;
    --danger: #FF6B6B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Jua', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .panel {
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 6px 24px rgba(43,58,85,0.10);
    padding: 32px 28px;
    width: 100%;
    max-width: 480px;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 22px; }

  .label { font-size: 15px; margin-bottom: 8px; display: block; }
  .grades, .bans { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 18px; }
  .bans { grid-template-columns: repeat(4, 1fr); }
  .pick {
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    padding: 11px 0;
    border: 2px solid var(--muted);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .pick.on { border-color: var(--accent); background: var(--accent); color: #fff; }

  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="url"], input[type="text"] {
    flex: 1;
    font-family: sans-serif;
    font-size: 15px;
    padding: 13px 14px;
    border: 2px solid var(--muted);
    border-radius: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .paste-btn {
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    padding: 0 16px;
    border: 2px solid var(--accent);
    border-radius: 14px;
    background: #EDF3FF;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }

  .send-btn {
    width: 100%;
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    padding: 18px;
    margin-top: 6px;
    border: none;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-dark);
  }
  .send-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .clear-btn {
    width: 100%;
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    padding: 13px;
    margin-top: 10px;
    border: 2px solid var(--danger);
    border-radius: 14px;
    background: #FFF3F3;
    color: var(--danger);
    cursor: pointer;
  }
  .clear-btn:active { background: #FFE2E2; }

  #msg { min-height: 24px; margin-top: 14px; font-size: 15px; text-align: center; }
  #msg.ok { color: #2BA57A; }
  #msg.err { color: var(--danger); }
  .now {
    margin-top: 18px;
    background: #F0FAF7;
    border: 2px dashed var(--mint);
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
    display: none;
  }
  .now b { display: block; font-size: 15px; margin-bottom: 4px; }
  .now .u { font-family: sans-serif; font-size: 12px; color: var(--muted); word-break: break-all; }

  .credit { position: fixed; bottom: 10px; right: 14px; font-size: 11px; color: var(--muted); opacity: 0.7; }
</style>
</head>
<body>

<div class="panel">
  <h1>🔔 띵동링크 보내기</h1>
  <div class="sub">학년과 반을 고르고 링크를 보내면 학생 화면에 바로 나타나요</div>

  <span class="label">받을 학년</span>
  <div class="grades" id="grades">
    <button class="pick" data-g="1">1</button>
    <button class="pick" data-g="2">2</button>
    <button class="pick" data-g="3">3</button>
    <button class="pick" data-g="4">4</button>
    <button class="pick" data-g="5">5</button>
    <button class="pick" data-g="6">6</button>
  </div>

  <span class="label">받을 반</span>
  <div class="bans" id="bans">
    <button class="pick" data-b="가">가</button>
    <button class="pick" data-b="나">나</button>
    <button class="pick" data-b="다">다</button>
    <button class="pick" data-b="라">라</button>
    <button class="pick" data-b="마">마</button>
    <button class="pick" data-b="바">바</button>
    <button class="pick" data-b="사">사</button>
    <button class="pick" data-b="아">아</button>
  </div>

  <span class="label">보낼 링크 (URL)</span>
  <div class="row">
    <input type="url" id="url" placeholder="https://...">
    <button class="paste-btn" id="pasteBtn">붙여넣기</button>
  </div>

  <span class="label">제목 (학생 화면에 크게 표시, 선택)</span>
  <div class="row">
    <input type="text" id="title" placeholder="예: 오토드로우 접속" maxlength="40">
  </div>

  <button class="send-btn" id="sendBtn">🚀 전송하기</button>
  <button class="clear-btn" id="clearBtn">🧹 링크 지우기 (대기 화면으로)</button>
  <div id="msg"></div>

  <div class="now" id="now">
    <b id="nowTitle"></b>
    <span id="nowTime"></span>
    <div class="u" id="nowUrl"></div>
  </div>
</div>

<div class="credit">ⓒ 띵동링크 · 디지털튜터</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { initializeFirestore, doc, getDocFromServer, setDoc, deleteDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzjH1WGwpWYWNrrUwM3siseeyMzfi_GcA",
    authDomain: "ddingdong-link.firebaseapp.com",
    projectId: "ddingdong-link",
    storageBucket: "ddingdong-link.firebasestorage.app",
    messagingSenderId: "644579021905",
    appId: "1:644579021905:web:e1509743f8bb5156a61470"
  };
  const app = initializeApp(firebaseConfig);
  const db = initializeFirestore(app, { experimentalForceLongPolling: true });
  const $ = (id) => document.getElementById(id);

  // 페이지를 열자마자 백그라운드에서 서버 연결을 미리 맺어둠 (첫 전송 지연 완화)
  getDocFromServer(doc(db, "links", "1가")).catch(() => {});

  const BAN_LIST = ["가","나","다","라","마","바","사","아"];
  let grade = null, ban = null, unsub = null;

  function selectGrade(g) {
    grade = g;
    document.querySelectorAll('#grades .pick').forEach(b => b.classList.toggle('on', b.dataset.g === g));
    trySaveAndWatch();
  }
  function selectBan(b) {
    ban = b;
    document.querySelectorAll('#bans .pick').forEach(el => el.classList.toggle('on', el.dataset.b === b));
    trySaveAndWatch();
  }
  function trySaveAndWatch() {
    if (grade && ban) {
      try { localStorage.setItem("dd-teacher-room", JSON.stringify({grade, ban})); } catch(e) {}
      watchCurrent(grade, ban);
    }
  }

  $("grades").addEventListener("click", (e) => {
    const btn = e.target.closest(".pick");
    if (btn) selectGrade(btn.dataset.g);
  });
  $("bans").addEventListener("click", (e) => {
    const btn = e.target.closest(".pick");
    if (btn) selectBan(btn.dataset.b);
  });

  // 마지막으로 선택한 학년/반 자동 선택
  try {
    const saved = JSON.parse(localStorage.getItem("dd-teacher-room") || "null");
    if (saved && saved.grade && BAN_LIST.includes(saved.ban)) {
      selectGrade(saved.grade);
      selectBan(saved.ban);
    }
  } catch (e) {}

  // ?url= 로 들어오면 자동 채움 (단축어 연동용)
  const pageParams = new URLSearchParams(location.search);
  const prefillUrl = pageParams.get("url");
  if (prefillUrl && /^https?:\/\/.+/.test(prefillUrl)) {
    $("url").value = prefillUrl;
    showMsg("링크가 자동으로 입력됐어요. 학년/반 확인 후 전송을 누르세요!", "ok");
  }

  function watchCurrent(g, b) {
    if (unsub) unsub();
    unsub = onSnapshot(doc(db, "links", `${g}${b}`), (snap) => {
      const now = $("now");
      now.style.display = "block";
      if (snap.exists() && snap.data().url) {
        const d = snap.data();
        $("nowTitle").textContent = `📌 ${g}학년 ${b}반에 지금 떠 있는 링크: ${d.title || "(제목 없음)"}`;
        $("nowUrl").textContent = d.url;
        if (d.updatedAt && d.updatedAt.toDate) {
          const t = d.updatedAt.toDate();
          $("nowTime").textContent = `${t.getHours()}시 ${String(t.getMinutes()).padStart(2,"0")}분 전송됨`;
        } else { $("nowTime").textContent = ""; }
      } else {
        $("nowTitle").textContent = `📭 ${g}학년 ${b}반은 지금 대기 화면입니다`;
        $("nowUrl").textContent = "";
        $("nowTime").textContent = "";
      }
    });
  }

  $("pasteBtn").onclick = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) $("url").value = t.trim();
    } catch {
      showMsg("붙여넣기 권한이 없어요. 길게 눌러 직접 붙여넣어 주세요.", "err");
    }
  };

  $("sendBtn").onclick = () => {
    const url = $("url").value.trim();
    const title = $("title").value.trim();
    if (!grade || !ban) return showMsg("받을 학년과 반을 먼저 선택해주세요", "err");
    if (!/^https?:\/\/.+/.test(url)) return showMsg("http:// 또는 https:// 로 시작하는 주소를 입력해주세요", "err");

    setDoc(doc(db, "links", `${grade}${ban}`), {
      url: url,
      title: title || "선생님이 보낸 링크",
      updatedAt: serverTimestamp()
    }).catch((err) => {
      console.error(err);
      showMsg("전송 실패: " + err.message + " (다시 눌러주세요)", "err");
    });

    showMsg(`✅ ${grade}학년 ${ban}반으로 전송 완료!`, "ok");
    $("url").value = "";
    $("title").value = "";
  };

  $("clearBtn").onclick = () => {
    if (!grade || !ban) return showMsg("지울 학년과 반을 먼저 선택해주세요", "err");
    deleteDoc(doc(db, "links", `${grade}${ban}`)).catch((err) => {
      console.error(err);
      showMsg("지우기 실패: " + err.message + " (다시 눌러주세요)", "err");
    });
    showMsg(`🧹 ${grade}학년 ${ban}반 링크를 지웠어요.`, "ok");
  };

  function showMsg(text, cls) {
    const m = $("msg");
    m.textContent = text;
    m.className = cls;
  }
</script>
</body>
</html>
